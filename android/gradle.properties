# JVM 内存与编码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin / Android 通用开关
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# 注：AGP 9.0 起 BuildConfig 生成改为 per-module 开关（app/build.gradle.kts 的
#     buildFeatures { buildConfig = true }）；全局 android.defaults.buildfeatures.buildconfig
#     已移除。android.nonFinalResIds 亦已废弃（默认 true），故此处不再设置。
