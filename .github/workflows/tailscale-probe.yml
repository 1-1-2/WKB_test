name: tailscale-probe

# 用途：验证 GitHub-hosted Windows runner 能否通过 Tailscale 加入 tailnet，
# 并起一个可 SSH 的入口，供维护者从自己的设备直连取证。
# 触发：仅 workflow_dispatch（不挂 push/schedule，避免误触发占用配额）。

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '保持在线分钟数（上限 25）'
        required: true
        default: '15'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Install and join Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'tailscale-setup.exe'
          Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile $msi
          Start-Process -FilePath $msi -ArgumentList '/quiet' -Wait
          $ts = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-win-probe" --unattended
          & $ts status
          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          Write-Host "TAILSCALE_IP=$ip"
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:RUNNER_TEMP\ts_ip.txt -Encoding ascii

      - name: Enable OpenSSH server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          Set-Service sshd -StartupType Automatic
          Start-Service sshd
          if (-not (Get-NetFirewallRule -Name sshd-ts -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name sshd-ts -DisplayName 'sshd (tailscale)' -Enabled True `
              -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 | Out-Null
          }
          $key = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILhEgs2u4IK7QazB+VRouxNEfrc+vj1SzrThxDArxJvj workbuddy-ci-debug'
          $f = Join-Path $env:ProgramData 'ssh\administrators_authorized_keys'
          Set-Content -Path $f -Value $key -Encoding ascii
          icacls $f /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          Get-Service sshd | Format-List Status,StartType
          Write-Host 'SSHD_READY'

      - name: Keep alive
        shell: pwsh
        run: |
          $m = [int]${{ inputs.minutes }}
          if ($m -gt 25) { $m = 25 }
          $ip = (Get-Content "$env:RUNNER_TEMP\ts_ip.txt") -replace 'TAILSCALE_IP=',''
          Write-Host "SSH: ssh -o ProxyCommand='tailscale nc %h %p' runneradmin@$ip"
          for ($i = 0; $i -lt ($m * 2); $i++) {
            Start-Sleep -Seconds 30
            Write-Host "alive $i/$(($m*2))"
          }
