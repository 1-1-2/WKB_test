name: Hello Windows

on:
  push:
  workflow_dispatch:

jobs:
  greet:
    name: Greet from Windows
    runs-on: windows-latest
    steps:
      - name: Say Hello World
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "  Hello World from a Windows runner!"
          Write-Host "=============================================="
          Write-Host "RUNNER_OS   : $env:RUNNER_OS"
          Write-Host "RUNNER_ARCH : $env:RUNNER_ARCH"
          Write-Host "RUNNER_NAME : $env:RUNNER_NAME"
          Write-Host "GITHUB_REF  : $env:GITHUB_REF"
          Write-Host "OS Version  : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell  : $($PSVersionTable.PSVersion.ToString())"
          Write-Host "Machine     : $env:COMPUTERNAME"
          Write-Host "Local time  : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
