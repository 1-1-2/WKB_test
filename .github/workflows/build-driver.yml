name: build-driver

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'

# 驱动编译采用微软官方 Windows-driver-samples 的 NuGet 模式：
#   nuget restore driver\packages.config   （WDK 头/库/工具集全部来自 NuGet 包）
#   msbuild driver\MicLinkVirtualMic.sln -p:_NT_TARGET_VERSION=0xA000012
# 不安装 WDK、不桥接 SDK 目录、不注入 INCLUDE/LIB 环境变量。
#
# 注意：runner 的 PATH 里没有 msbuild，必须经 vswhere 定位
# （官方示例的 Build-Samples.ps1 是先进入 VS DevShell，效果等价）。
#
# 版本对应（变更 WDK 时三处同步改）：
#   driver/packages.config               包版本 10.0.28000.2526
#   driver/Directory.Build.props         导入路径里的版本号目录名
#   本文件                               _NT_TARGET_VERSION = 0xA000012 (NTDDI, 10.0.28000)

jobs:
  build:
    name: Build MicLinkVirtualMic (x64)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. 还原 WDK NuGet 包（~200MB：WDK.x64 + SDK.CPP[.x64]）
      # ---------------------------------------------------------------
      - name: Restore WDK NuGet packages
        shell: pwsh
        run: |
          nuget restore driver\packages.config -PackagesDirectory driver\packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 自检：包内 km 头与工具集 props 必须就位
          $pkg = "driver\packages\Microsoft.Windows.WDK.x64.10.0.28000.2526"
          foreach ($f in @(
            "$pkg\c\Include\10.0.28000.0\km\portcls.h",
            "$pkg\c\build\10.0.28000.0\x64\WindowsKernelModeDriver\WDK.x64.WindowsKernelModeDriver.props"
          )) {
            if (Test-Path $f) { Write-Host "OK: $f" } else { Write-Host "!! 缺失: $f"; exit 1 }
          }

      # ---------------------------------------------------------------
      # 2. 定位 MSBuild（PATH 里没有，用 vswhere）
      # ---------------------------------------------------------------
      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $all = & $vswhere -latest -requires Microsoft.Component.MSBuild `
                   -find MSBuild\**\Bin\MSBuild.exe
          # WDK 28000 的 NuGet 包没有 x86 版 InfVerif.dll（包内
          # c\build\<ver>\bin\ 只有 x64/ 与 arm64/）。32 位 MSBuild 下
          # DPVerifierTask 选 x86 导入名，必然以
          # "Unable to load DLL 'x86\InfVerif.dll'" 失败（CI run 39335899536 实证）。
          # vswhere 返回的第一个结果（MSBuild\Current\Bin\MSBuild.exe）就是 32 位，
          # 必须显式选 amd64 下的 64 位 MSBuild。
          $msb = $all | Where-Object { $_ -like "*\amd64\MSBuild.exe" } | Select-Object -First 1
          if (-not $msb) {
            Write-Host "!! 未找到 64 位 MSBuild（MSBuild\Current\Bin\amd64\MSBuild.exe）"
            Write-Host "!! WDK 28000 NuGet 构建要求 64 位 MSBuild，拒绝回退 32 位"
            $all | ForEach-Object { Write-Host "  candidate: $_" }
            exit 1
          }
          Write-Host "MSBuild: $msb"
          "path=$msb" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ---------------------------------------------------------------
      # 3. 编译（Release x64）。本步骤失败即任务失败，不设 continue-on-error，
      #    避免"步骤显示成功但实际失败"的静默通过（见 commit 历史教训）。
      # ---------------------------------------------------------------
      - name: Build solution (Release x64)
        id: build
        shell: pwsh
        run: |
          $cfg = "${{ github.event.inputs.configuration }}"
          if ([string]::IsNullOrWhiteSpace($cfg)) { $cfg = "Release" }
          $msb = "${{ steps.msbuild.outputs.path }}"
          $sln = Join-Path $env:GITHUB_WORKSPACE "driver\MicLinkVirtualMic.sln"
          if (-not (Test-Path $sln)) {
            Write-Host "!!! sln 不存在: $sln"
            exit 99
          }
          Write-Host "编译: $sln ($cfg|x64)"
          # DPVerifierTask（InfVerif）以相对路径 "x64\InfVerif.dll" P/Invoke，
          # LoadLibrary 会搜索 PATH；把 WDK 包内 build\bin 目录注入进程 PATH，
          # 使包自带 x64\infverif.dll 可被找到（纯 NuGet 环境无机器 WDK 兜底）。
          # 注意：只动进程环境变量 PATH，不设 MSBuild 的 ExecutablePath 属性
          # （那个属性提前赋值会堵掉 VC 工具目录填充，导致 CL.exe TRK0005）。
          $wdkBin = Join-Path $env:GITHUB_WORKSPACE "driver\packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\c\build\10.0.28000.0\bin"
          if (Test-Path $wdkBin) {
            $env:PATH = "$wdkBin;$env:PATH"
            Write-Host "PATH 已注入 WDK 工具目录: $wdkBin"
          } else {
            Write-Host "::error::WDK 包 bin 目录缺失: $wdkBin"
            exit 1
          }
          & $msb $sln `
            -t:rebuild `
            -nologo -v:minimal -m `
            "-p:Configuration=$cfg" "-p:Platform=x64" `
            "-p:TargetVersion=Windows10" `
            "-p:_NT_TARGET_VERSION=0xA000012" `
            "-p:InfVerif_AdditionalOptions=/samples" `
            "-flp:logfile=build.log;verbosity=detailed"
          $code = $LASTEXITCODE
          Write-Host "MSBuild exit code: $code"
          if ($code -ne 0) {
            Write-Host "===== build.log 错误行（最后 30 条）====="
            if (Test-Path build.log) {
              Select-String -Path build.log -Pattern "error" |
                Select-Object -Last 30 | ForEach-Object { $_.Line }
              Write-Host "===== build.log 末尾 40 行 ====="
              Get-Content build.log -Tail 40
            } else { Write-Host "无 build.log" }
          }
          exit $code

      # ---------------------------------------------------------------
      # 4. 收集产物。必须排除 driver\packages\（NuGet 包内自带大量
      #    系统 .sys/.inf/.cat，曾把产物污染成 2.3MB 的无关文件）。
      # ---------------------------------------------------------------
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $found = Get-ChildItem -Path driver -Recurse -Include *.sys,*.inf,*.cat,*.pdb -EA SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\packages\\' }
          if ($found) {
            Write-Host "找到产物:"
            $found | ForEach-Object {
              Write-Host ("  " + $_.FullName + "  (" + $_.Length + " bytes)")
              Copy-Item $_.FullName -Destination out -Force
            }
          } else {
            Write-Host "!!! 未找到任何 sys/inf/cat/pdb"
            Get-ChildItem -Path driver -Recurse -Directory -EA SilentlyContinue |
              Where-Object { $_.Name -match "Release|x64" } | Select-Object -ExpandProperty FullName
            exit 1
          }
          # 关键产物必须在场，否则视为失败
          if (-not (Test-Path "out\miclinkvirtualmic.sys")) {
            Write-Host "::error::产物中缺少 miclinkvirtualmic.sys —— 驱动没有真正构建出来"
            exit 1
          }
          if (-not (Test-Path "out\MicLinkVirtualMic.inf")) {
            Write-Host "::error::产物中缺少 MicLinkVirtualMic.inf"
            exit 1
          }
          Get-ChildItem out | Format-Table Name,Length

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miclink-driver-x64
          path: out/
          if-no-files-found: error
