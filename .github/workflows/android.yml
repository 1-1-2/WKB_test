name: android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      interactive:
        description: 'Windows 交互式联调（SSH 进 runner 手动验证）'
        type: boolean
        required: false
        default: false

# 作业分层：
#   protocol-tests  :core:test（纯 JVM，字节级一致性，不需要 Android SDK）
#   app-build       真构建：含 opus 源码下载 + CMake/NDK 原生编译（三 ABI）
#   integration-test 闭环联调：ubuntu + KVM 模拟器跑真协议（pc_client.py ↔ app）
#   windows-interactive 仅 workflow_dispatch 勾选后运行
#     （WarpBuilds/action-debugger —— mxschmitt/action-tmate 的 Windows 可用分支，
#      详见 docs/devops/windows-interactive-debug.md）。

jobs:
  protocol-tests:
    name: Protocol conformance (:core:test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run protocol unit tests
        run: ./gradlew :core:test --no-daemon --configure-on-demand

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: android/core/build/reports/tests/

  app-build:
    name: Build debug APK (:app:assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 镜像自带 Android SDK；compileSdk 37（platforms;android-37.0，次版本命名）/ build-tools 36 需显式补齐
      # CMake 版本由 app/build.gradle.kts 的 externalNativeBuild.cmake.version 固定为 3.22.1；
      # NDK 用 AGP 9.1 默认的 28.2.13676358（本地实测值，见 docs/VERIFICATION.md）
      - name: Install Android SDK components
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" \
            "cmake;3.22.1" "ndk;28.2.13676358"

      # libopus 源码不入库（体积 + 许可证单独保留），CI 现场下载；
      # 缺了它 CMake 会 FATAL_ERROR（见 app/src/main/cpp/CMakeLists.txt）。
      - name: Fetch Opus source
        run: |
          set -e
          mkdir -p app/src/main/cpp
          rm -rf app/src/main/cpp/opus
          curl -fsSL --retry 3 -o /tmp/opus.tar.gz \
            https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz \
            || curl -fsSL --retry 3 -o /tmp/opus.tar.gz \
            https://codeload.github.com/xiph/opus/tar.gz/refs/tags/v1.5.2
          rm -rf /tmp/opus-src && mkdir -p /tmp/opus-src
          tar -xzf /tmp/opus.tar.gz -C /tmp/opus-src
          mv "$(ls -d /tmp/opus-src/opus-*/ | head -1)" app/src/main/cpp/opus
          test -f app/src/main/cpp/opus/CMakeLists.txt
          test -f app/src/main/cpp/opus/include/opus.h

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  integration-test:
    name: Interop closed loop (emulator + pc_client.py)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 联调需要：编译平台（android-37.0）+ 运行镜像（android-34）+ emulator + platform-tools
      # + CMake 3.22.1 / NDK 28.2.13676358（原生 opus 编译）
      - name: Install Android SDK components
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" \
            "cmake;3.22.1" "ndk;28.2.13676358" \
            "system-images;android-34;default;x86_64" "emulator" "platform-tools"

      - name: Fetch Opus source
        run: |
          set -e
          mkdir -p app/src/main/cpp
          rm -rf app/src/main/cpp/opus
          curl -fsSL --retry 3 -o /tmp/opus.tar.gz \
            https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz \
            || curl -fsSL --retry 3 -o /tmp/opus.tar.gz \
            https://codeload.github.com/xiph/opus/tar.gz/refs/tags/v1.5.2
          rm -rf /tmp/opus-src && mkdir -p /tmp/opus-src
          tar -xzf /tmp/opus.tar.gz -C /tmp/opus-src
          mv "$(ls -d /tmp/opus-src/opus-*/ | head -1)" app/src/main/cpp/opus
          test -f app/src/main/cpp/opus/CMakeLists.txt
          test -f app/src/main/cpp/opus/include/opus.h

      # GitHub ubuntu runner 默认带 /dev/kvm（嵌套虚拟化）；没有它软件模拟基本跑不动
      - name: Verify KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm 不存在，无法硬件加速运行 Android 模拟器"
            exit 1
          fi
          ls -la /dev/kvm

      # 只打 x86_64：省两次跨 ABI 原生编译（opus + JNI），模拟器只要这一个 ABI
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -PwomicAbis=x86_64

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd -n womic_interop \
            -k "system-images;android-34;default;x86_64" -d pixel_6 --force \
          || echo "no" | avdmanager create avd -n womic_interop \
            -k "system-images;android-34;default;x86_64" --force

      - name: Start emulator
        run: |
          EMU="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/emulator/emulator"
          [ -x "$EMU" ] || EMU=emulator
          nohup "$EMU" -avd womic_interop \
            -no-window -no-audio -no-boot-anim -no-metrics -accel on \
            -gpu swiftshader_indirect -memory 2048 > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 60); do
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && break
            sleep 10
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
            echo "::error::模拟器 10 分钟未启动完成"
            tail -50 /tmp/emulator.log
            exit 1
          fi
          adb shell input keyevent 82 || true

      - name: Install and launch app
        run: |
          # 模拟器镜像是 userdebug：adb root 后 am start-service 不受后台启动限制
          adb root
          adb wait-for-device
          # -g：安装即授予 RECORD_AUDIO / POST_NOTIFICATIONS 等运行时权限
          adb install -r -g app/build/outputs/apk/debug/app-debug.apk
          adb shell wm dismiss-keyguard || true
          # 先拉前台 Activity：既是 UI 启动冒烟，也让 FGS 启动合规
          adb shell am start -n com.miclink.open/.MainActivity
          sleep 3
          # 调试音模式：不需要真麦克风，440Hz 正弦即可验证整条媒体链路
          adb shell am start-service -n com.miclink.open/.MicCaptureService \
            -a com.miclink.open.action.START \
            --ei extra.control_port 8125 --ei extra.volume 5 --ez extra.debug_tone true
          sleep 2
          adb shell dumpsys activity services com.miclink.open | grep -i MicCapture || true

      # 闭环联调：C01~C15 见 android/verify/integration/README.md
      - name: Interop closed loop (pc_client.py)
        run: python3 verify/integration/pc_client.py --hold-seconds 12

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/diag
          adb logcat -d > /tmp/diag/logcat.txt 2>&1 || true
          cp /tmp/emulator.log /tmp/diag/emulator.log 2>/dev/null || true
          adb shell dumpsys activity services com.miclink.open > /tmp/diag/services.txt 2>&1 || true
          adb shell getprop > /tmp/diag/props.txt 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-diagnostics
          path: /tmp/diag/
          if-no-files-found: warn

  windows-interactive:
    name: Windows interactive debug (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.interactive
    runs-on: windows-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: pwsh
        run: |
          sdkmanager --licenses > $null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" `
            "cmake;3.22.1" "ndk;28.2.13676358"

      # 与 app-build 相同：CI 现场下载 opus 源码，缺了它 CMake 会 FATAL_ERROR
      - name: Fetch Opus source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app/src/main/cpp | Out-Null
          if (Test-Path app/src/main/cpp/opus) { Remove-Item -Recurse -Force app/src/main/cpp/opus }
          $urls = @(
            "https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz",
            "https://codeload.github.com/xiph/opus/tar.gz/refs/tags/v1.5.2"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile opus.tar.gz -MaximumRetryCount 3
              $ok = $true; break
            } catch { Write-Host "download failed: $u" }
          }
          if (-not $ok) { throw "opus source download failed" }
          New-Item -ItemType Directory -Force -Path opus-src | Out-Null
          tar -xzf opus.tar.gz -C opus-src
          $dir = Get-ChildItem -Directory opus-src | Select-Object -First 1
          Move-Item $dir.FullName app/src/main/cpp/opus
          if (-not (Test-Path app/src/main/cpp/opus/CMakeLists.txt)) { throw "opus CMakeLists.txt missing" }

      - name: Prebuild artifacts
        run: ./gradlew :core:test :app:assembleDebug --no-daemon

      # 交互式会话：连接信息打印在日志与 Checks 页底部；
      # 在会话里 touch continue 放行后续步骤（或直接退出 shell 结束作业）。
      - name: Interactive SSH session
        uses: WarpBuilds/action-debugger@v1.3
        with:
          limit-access-to-actor: true
        timeout-minutes: 120
