name: schedtask-diag

# 计划任务登录类型诊断（g1 步骤的配套实验台，workflow_dispatch 手动触发）。
#
# 背景：windows-e2e 的 g1 步要把探针注册成"标准用户 × Password logon ×
# Session 0"的计划任务，四轮 CI 都没拿到预期的 Logon Mode: Password：
#   run 39906824245  schtasks /create /tr /ru /rp（无 /xml）  → Interactive/Background
#   run 39910125177  Register-ScheduledTask -Principal + -Password → 参数集错误
#   run 39921983841  schtasks /create /xml(LogonType=Password) + /ru /rp → Interactive/Background
#   run 39924487481  Register-ScheduledTask -User -Password（User 集）  → Interactive/Background
# 两个完全不同的注册路径同一结果，需要一次性实验定位：
#   1. Get-ScheduledTask 的 Principal.LogonType（cmdlet 视角）与
#      schtasks /query 的 Logon Mode（CLI 视角）是否一致——排除显示层误判；
#   2. 哪个变体能注册出真正的 Password logon；
#   3. 注册出的任务 /run 后是否真的启动（marker 是否出现）；
#   4. SeBatchLogonRight 是否被自动授予（secedit 导出 USER_RIGHTS）。
#
# 本 workflow 只做诊断：全部任务在 finally 里删除，不装驱动、不跑探针，
# 不影响 windows-e2e 的任何状态。结论固化回 windows-e2e.yml 后本文件保留
# 作团队知识。
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 计划任务登录类型变体实验
        shell: pwsh
        run: |
          $user = 'womic-diag'
          $pass = 'Womic-Diag-2026!'
          $sec  = ConvertTo-SecureString $pass -AsPlainText -Force
          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
            try {
              New-LocalUser -Name $user -Password $sec -Description "schedtask diag" -ErrorAction Stop | Out-Null
              "diag user created"
            } catch {
              Write-Host "::error::diag: 建用户失败: $($_.Exception.Message)"
              exit 1
            }
          }
          $acct = "$env:COMPUTERNAME\$user"
          $dir  = "$env:TEMP\womic-diag"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $action   = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c `"$dir\diag.cmd`""
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 5) -MultipleInstances IgnoreNew

          # 每个变体一个 bat + 一个 marker：/run 后 marker 出现 = 任务真的启动了
          function New-VariantBat($name) {
            $bat = "$dir\$name.cmd"
            $marker = "$dir\$name.marker"
            $lines = @(
              '@echo off',
              "echo RAN > `"$marker`"",
              'exit /b 0'
            )
            $lines | Set-Content -Path $bat -Encoding ascii
            return $bat
          }
          function Show-Registration($name) {
            # 双视角判读：cmdlet 的 Principal.LogonType + CLI 的 Logon Mode
            $t = Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            $lt = if ($t) { $t.Principal.LogonType } else { '<no task>' }
            $q = & schtasks /query /tn $name /fo LIST /v 2>&1 | Out-String
            $mode = [regex]::Match($q, 'Logon Mode:\s*(\S+)').Groups[1].Value
            $runas = [regex]::Match($q, 'Run As User:\s*(\S+)').Groups[1].Value
            Write-Host "DIAG[$name] cmdlet.LogonType='$lt' cli.LogonMode='$mode' RunAs='$runas'"
            return $lt
          }
          function Try-Run($name) {
            $marker = "$dir\$name.marker"
            if (Test-Path $marker) { Remove-Item $marker -Force }
            & schtasks /run /tn $name 2>&1 | Out-String | Write-Host
            $ok = $false
            for ($i = 0; $i -lt 20 -and -not (Test-Path $marker); $i++) { Start-Sleep -Seconds 3 }
            $ok = Test-Path $marker
            $q = & schtasks /query /tn $name /fo LIST /v 2>&1 | Out-String
            $lr = [regex]::Match($q, 'Last Result:\s*(\S+)').Groups[1].Value
            Write-Host "DIAG[$name] run => marker=$ok LastResult='$lr'"
          }
          function Cleanup($name) {
            & schtasks /delete /tn $name /f 2>&1 | Out-Null
          }

          # ---- V1：cmdlet User 集，-Password 传 String（windows-e2e 现方案）----
          try {
            New-VariantBat 'DiagV1' | Out-Null
            Register-ScheduledTask -TaskName DiagV1 -Action $action -Settings $settings `
              -User $acct -Password $pass -Force -ErrorAction Stop | Out-Null
            Write-Host "V1: registered"
          } catch { Write-Host "V1 ERROR: $($_.Exception.Message)" }
          $lt1 = Show-Registration DiagV1

          # ---- V2：cmdlet User 集，-Password 传 SecureString（验证参数类型）----
          try {
            New-VariantBat 'DiagV2' | Out-Null
            Register-ScheduledTask -TaskName DiagV2 -Action $action -Settings $settings `
              -User $acct -Password $sec -Force -ErrorAction Stop | Out-Null
            Write-Host "V2: registered"
          } catch { Write-Host "V2 ERROR: $($_.Exception.Message)" }
          $null = Show-Registration DiagV2

          # ---- V3：cmdlet Object 集：New-ScheduledTask(Password principal) + -InputObject ----
          try {
            New-VariantBat 'DiagV3' | Out-Null
            $principal3 = New-ScheduledTaskPrincipal -UserId $acct -LogonType Password -RunLevel Limited
            $taskDef3 = New-ScheduledTask -Action $action -Settings $settings -Principal $principal3
            Register-ScheduledTask -TaskName DiagV3 -InputObject $taskDef3 `
              -User $acct -Password $pass -Force -ErrorAction Stop | Out-Null
            Write-Host "V3: registered"
          } catch { Write-Host "V3 ERROR: $($_.Exception.Message)" }
          $null = Show-Registration DiagV3

          # ---- V4：cmdlet Xml 集：XML 显式 LogonType=Password + -User -Password ----
          $xmlLines = @(
            '<?xml version="1.0" encoding="UTF-16"?>',
            '<Task version="1.2" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task">',
            '  <RegistrationInfo>',
            '    <Description>schedtask diag v4</Description>',
            '  </RegistrationInfo>',
            '  <Triggers>',
            '    <BootTrigger><Enabled>false</Enabled></BootTrigger>',
            '  </Triggers>',
            '  <Principals>',
            '    <Principal id="Author">',
            "      <UserId>$acct</UserId>",
            '      <LogonType>Password</LogonType>',
            '      <RunLevel>LeastPrivilege</RunLevel>',
            '    </Principal>',
            '  </Principals>',
            '  <Settings>',
            '    <MultipleInstancesPolicy>IgnoreNew</MultipleInstancesPolicy>',
            '    <AllowStartOnDemand>true</AllowStartOnDemand>',
            '    <Enabled>true</Enabled>',
            '    <ExecutionTimeLimit>PT5M</ExecutionTimeLimit>',
            '  </Settings>',
            '  <Actions Context="Author">',
            '    <Exec>',
            '      <Command>cmd.exe</Command>',
            "      <Arguments>/c `"$dir\DiagV4.cmd`"</Arguments>",
            '    </Exec>',
            '  </Actions>',
            '</Task>'
          )
          $xmlPath = "$dir\DiagV4.xml"
          [IO.File]::WriteAllText($xmlPath, ($xmlLines -join "`r`n"), [Text.Encoding]::Unicode)
          try {
            New-VariantBat 'DiagV4' | Out-Null
            $xml = [IO.File]::ReadAllText($xmlPath, [Text.Encoding]::Unicode)
            Register-ScheduledTask -TaskName DiagV4 -Xml $xml `
              -User $acct -Password $pass -Force -ErrorAction Stop | Out-Null
            Write-Host "V4: registered"
          } catch { Write-Host "V4 ERROR: $($_.Exception.Message)" }
          $null = Show-Registration DiagV4

          # ---- V5：schtasks /create /xml 不带 /ru（Password XML 无凭据时的行为）----
          try {
            New-VariantBat 'DiagV5' | Out-Null
            & schtasks /create /tn DiagV5 /xml $xmlPath /f 2>&1 | Out-String | Write-Host
            Write-Host "V5: schtasks rc=$LASTEXITCODE"
          } catch { Write-Host "V5 ERROR: $($_.Exception.Message)" }
          $null = Show-Registration DiagV5

          # ---- 触发实验：把注册成功的变体逐个 /run，看谁真的启动 ----
          foreach ($n in @('DiagV1','DiagV2','DiagV3','DiagV4','DiagV5')) {
            if (Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue) {
              Try-Run $n
            }
          }

          # ---- 权限诊断：SeBatchLogonRight 是否自动授予（只读导出）----
          & secedit /export /cfg "$dir\rights.inf" /areas USER_RIGHTS 2>&1 | Out-Null
          if (Test-Path "$dir\rights.inf") {
            Get-Content "$dir\rights.inf" |
              Where-Object { $_ -match 'SeBatchLogonRight|SeInteractiveLogonRight' } |
              Out-String | Write-Host
          }

          # ---- 环境信息 ----
          Get-Module ScheduledTasks -ListAvailable |
            Select-Object Name, Version | Format-Table | Out-String | Write-Host
          Write-Host "pwsh=$($PSVersionTable.PSVersion)"

          # ---- 收尾：全部删除 ----
          foreach ($n in @('DiagV1','DiagV2','DiagV3','DiagV4','DiagV5')) {
            Cleanup $n
          }
          Write-Host "diag done (all variants cleaned up)"
