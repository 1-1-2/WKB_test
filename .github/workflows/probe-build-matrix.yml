name: probe-build-matrix

on:
  workflow_dispatch:

jobs:
  matrix:
    name: "${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: A
            label: "win-latest(VS2026) + WDK 28000"
            os: windows-latest
            wdk: Microsoft.WindowsWDK.10.0.28000
          - key: B
            label: "win-2022(VS2022) + WDK 26100"
            os: windows-2022
            wdk: Microsoft.WindowsWDK.10.0.26100
          - key: C
            label: "win-latest(VS2026) + WDK 26100 (对照已知失败)"
            os: windows-latest
            wdk: Microsoft.WindowsWDK.10.0.26100

    steps:
      - uses: actions/checkout@v4

      - name: Show baseline SDK / VS
        shell: pwsh
        run: |
          $vs = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vs) { & $vs -latest -property displayName }
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory -EA SilentlyContinue |
            Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "SDK Include: $_" }

      - name: Install WDK ${{ matrix.wdk }}
        shell: pwsh
        run: |
          winget install --id ${{ matrix.wdk }} --source winget `
            --accept-source-agreements --accept-package-agreements --disable-interactivity 2>&1 | Out-String
          Write-Host "winget exit: $LASTEXITCODE"

      - name: Locate MSBuild
        id: msb
        shell: pwsh
        run: |
          $msb = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                   -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
                 Select-Object -First 1
          Write-Host "MSBuild: $msb"
          "path=$msb" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          $sln = Join-Path $env:GITHUB_WORKSPACE "driver\WomicVirtualMic.sln"
          & "${{ steps.msb.outputs.path }}" $sln `
              "/p:Configuration=Release" "/p:Platform=x64" `
              "/m" "/nologo" "/v:minimal" `
              "/flp:logfile=build.log;verbosity=detailed"
          $c = $LASTEXITCODE
          Write-Host "MSBuild exit: $c"
          "exit=$c" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verdict
        shell: pwsh
        run: |
          $c = "${{ steps.build.outputs.exit }}"
          if ($c -eq "0") { Write-Host ">>> RESULT: BUILD OK (${{ matrix.label }})" }
          else {
            Write-Host ">>> RESULT: BUILD FAILED (${{ matrix.label }}) exit=$c"
            if (Test-Path build.log) {
              Get-Content build.log | Select-String -Pattern "error" | Select-Object -First 12 |
                ForEach-Object { Write-Host ("  " + $_.Line.Substring(0, [Math]::Min(190, $_.Line.Length))) }
            }
          }

      - name: Collect & upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Path driver -Recurse -Include *.sys,*.inf,*.cat -EA SilentlyContinue |
            ForEach-Object { Write-Host ("产物: " + $_.FullName); Copy-Item $_.FullName out -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.key }}
          path: out/
          if-no-files-found: ignore
